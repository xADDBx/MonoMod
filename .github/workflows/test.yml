name: Test

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
  
defaults:
  run:
    shell: pwsh

env:
  DOTNET_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{github.workspace}}/artifacts/pkg
  RestoreLockedMode: true
  XunitVersion: "2.4.2"
  # The pinned 4.6.2-tagged image contains .NET Framework 4.7.2.
  NETFX_IMAGE: mcr.microsoft.com/dotnet/framework/runtime:4.6.2@sha256:17f9a2898ce58deac21b9ad9d008b7a56a2fb932e01ccb41a80f298b340a48a9

  DUMPS_PATH: ${{github.workspace}}/artifacts/dumps/
  WORKSPACE: ${{github.workspace}}
  DOTNET_DbgEnableMiniDump: 1
  DOTNET_DbgMiniDumpName: "${{github.workspace}}/artifacts/dumps/dump_%e_%p.dmp"
  DOTNET_DbgMiniDumpType: 4
  DOTNET_CreateDumpDiagnostics: 1
  DOTNET_CreateDumpVerboseDiagnostics: 1
  DOTNET_EnableDumpOnSigTerm: 1
  COMPlus_DbgEnableMiniDump: 1
  COMPlus_DbgMiniDumpName: "${{github.workspace}}/artifacts/dumps/dump_%e_%p.dmp"
  COMPlus_DbgMiniDumpType: 4
  COMPlus_CreateDumpDiagnostics: 1
  COMPlus_CreateDumpVerboseDiagnostics: 1
  COMPlus_EnableDumpOnSigTerm: 1

jobs:
  test:  
    name: Test
    runs-on: ${{ fromJSON(inputs.matrix).os.runner }}
    container: ${{ fromJSON(inputs.matrix).container }}
    env:
      LOG_FILE_NAME: testresults.${{ fromJSON(inputs.matrix).os.runner }}.${{ fromJSON(inputs.matrix).dotnet.id != '' && fromJSON(inputs.matrix).dotnet.id || fromJSON(inputs.matrix).dotnet.sdk }}.${{ fromJSON(inputs.matrix).arch }}

    steps:
    - name: Start Docker
      if: ${{ fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      timeout-minutes: 1
      run: |
        $service = Get-Service docker
        if ($service.Status -ne 'Running') {
            Start-Service docker
            $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
        }
        docker info | Out-Null
        if ($LASTEXITCODE -ne 0) {
            throw 'Docker did not become ready.'
        }

    - name: Install coreutils
      uses: tecolicom/actions-use-homebrew-tools@v1 # we use this action instead of just a brew install so that the downloaded package gets cached
      if: ${{ runner.os == 'macOS' }}
      with:
        key: ${{ fromJSON(inputs.matrix).os.runner }}-brew-coreutils
        tools: coreutils
    
    # MacOS 13 ships an LLDB that doesn't work properly for crashes off the main thread. We install LLVM from Brew for its LLDB that doesn't have this issue.
    - name: Install LLVM from Brew
      uses: tecolicom/actions-use-homebrew-tools@v1 # we use this action instead of just a brew install so that the downloaded package gets cached
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono && fromJSON(inputs.matrix).os.runner == 'macos-13' }}
      with:
        key: ${{ fromJSON(inputs.matrix).os.runner }}-brew-llvm
        tools: llvm@20 coreutils
    - name: Add new LLVM to PATH
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono && fromJSON(inputs.matrix).os.runner == 'macos-13' }}
      shell: bash
      run: echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

      # MacOS 15 images don't ship Mono at all
    - name: Install Mono from Brew
      uses: tecolicom/actions-use-homebrew-tools@v1 # we use this action instead of just a brew install so that the downloaded package gets cached
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono && startsWith(fromJSON(inputs.matrix).os.runner, 'macos-15') }}
      with:
        key: ${{ fromJSON(inputs.matrix).os.runner }}-brew-mono
        tools: mono
    - name: Add new Mono to PATH
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono && startsWith(fromJSON(inputs.matrix).os.runner, 'macos-15') }}
      shell: bash
      run: |
        echo "$(brew --prefix mono)/bin" >> "$GITHUB_PATH"
        echo "MONO_GAC_PREFIX=$(brew --prefix mono)" >> "$GITHUB_ENV"
      
    - name: Install ProcDump
      if: ${{ runner.os == 'Windows' && !fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      run: choco install procdump -y

    - name: Checkout
      uses: actions/checkout@v6
      if: ${{ fromJSON(inputs.matrix).dotnet.needsRestore || fromJSON(inputs.matrix).dotnet.isMono || fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      with:
        lfs: true
        submodules: recursive
        
    # Note: All of the SDKs we install have to be for the target architecture. Otherwise, we get issues when the default != the target.
    - name: Install global SDK
      if: ${{ !fromJSON(inputs.matrix).dotnet.needsRestore && !fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      uses: nike4613/install-dotnet@cc706db77ed67745a4a4cbae19b2869220e34d27
      with:
        architecture: ${{ fromJSON(inputs.matrix).arch }}
        version: "10.0"
        
    - name: Cache restored NuGet packages
      uses: actions/cache@v5
      if: ${{ fromJSON(inputs.matrix).dotnet.needsRestore }}
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-v2-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: ${{ runner.os }}-nuget-setup-v2-${{ hashFiles('build/gen-test-matrix/packages.lock.json') }}

    - name: Install restore SDK
      if: ${{ fromJSON(inputs.matrix).dotnet.needsRestore }}
      uses: nike4613/install-dotnet@cc706db77ed67745a4a4cbae19b2869220e34d27
      with:
        architecture: ${{ fromJSON(inputs.matrix).arch }}
        global-json: global.json

    - name: Ensure dumps path exists
      shell: pwsh
      run: New-Item -Type Directory -Force $env:DUMPS_PATH

    - name: Restore packages
      if: ${{ fromJSON(inputs.matrix).dotnet.needsRestore }}
      run: dotnet restore -noAutoRsp

    - name: Download test assets
      uses: actions/download-artifact@v7
      with:
        name: test-assets

    - name: Prepare legacy .NET Framework tests
      if: ${{ fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      run: |
        New-Item -ItemType Directory -Path payload\xunit | Out-Null
        Copy-Item .github\workflows\run-netfx-tests.ps1 payload
        Copy-Item release_net472 payload\tests -Recurse

        Invoke-WebRequest `
          -Uri "https://api.nuget.org/v3-flatcontainer/xunit.runner.console/$env:XunitVersion/xunit.runner.console.$env:XunitVersion.nupkg" `
          -OutFile xunit.zip
        Expand-Archive xunit.zip -DestinationPath xunit-package
        Copy-Item xunit-package\tools\net472\* payload\xunit -Recurse

    - name: Pull legacy .NET Framework image
      if: ${{ fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      timeout-minutes: 15
      run: docker pull $env:NETFX_IMAGE
        
    - name: Install test target runtime
      if: ${{ fromJSON(inputs.matrix).dotnet.sdk != '' }}
      uses: nike4613/install-dotnet@cc706db77ed67745a4a4cbae19b2869220e34d27
      with:
        version: ${{ fromJSON(inputs.matrix).dotnet.sdk }}
        architecture: ${{ fromJSON(inputs.matrix).arch }}
        runtime: dotnet

    - name: Setup Mono
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono }}
      id: setup_mono
      env:
        INPUT_JOB: ${{ inputs.matrix }}
      run: |
        dotnet run --project ./build/setup-mono/setup-mono.csproj -- $env:INPUT_JOB $env:GITHUB_OUTPUT $env:GITHUB_ENV ${{ runner.os }}

    - name: Print SDK info
      if: ${{ !fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      run: dotnet --info
      
    - name: Fix runtimeconfig.json probing paths
      if: ${{ fromJSON(inputs.matrix).dotnet.needsRestore }}
      run: |
        ConvertTo-Json @{runtimeOptions=@{additionalProbingPaths=@($env:NUGET_PACKAGES)}} > release_${{ fromJSON(inputs.matrix).dotnet.tfm }}/MonoMod.UnitTest.runtimeconfig.dev.json

    - name: Run tests
      if: ${{ !fromJSON(inputs.matrix).dotnet.isMono && !fromJSON(inputs.matrix).dotnet.pgo && !fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      run: |
        dotnet test `
          --blame-crash-dump-type full --blame-hang-timeout 5m --blame-hang-dump-type full `
          -f ${{ fromJSON(inputs.matrix).dotnet.tfm }} -a ${{ fromJSON(inputs.matrix).arch }} `
          -l:"trx;LogFileName=$($env:LOG_FILE_NAME).trx" release_${{ fromJSON(inputs.matrix).dotnet.tfm }}/MonoMod.UnitTest.dll

    - name: Run tests (legacy .NET Framework)
      if: ${{ fromJSON(inputs.matrix).dotnet.isLegacyFramework }}
      timeout-minutes: 5
      run: ./.github/workflows/run-netfx-container-tests.ps1 -Image $env:NETFX_IMAGE -Payload payload -Results TestResults -Architecture ${{ fromJSON(inputs.matrix).arch }}

    - name: Run tests (PGO)
      if: ${{ fromJSON(inputs.matrix).dotnet.pgo }}
      env:
        DOTNET_ReadyToRun: ${{ !fromJSON(inputs.matrix).usePgo && 1 || 0 }}
        DOTNET_TC_QuicJitForLoops: ${{ fromJSON(inputs.matrix).usePgo && 1 || 0 }}
        DOTNET_TieredPGO: ${{ fromJSON(inputs.matrix).usePgo && 1 || 0 }}
      run: |
        dotnet test `
          --blame-crash-dump-type full --blame-hang-timeout 5m --blame-hang-dump-type full `
          -f ${{ fromJSON(inputs.matrix).dotnet.tfm }} -a ${{ fromJSON(inputs.matrix).arch }} `
          -l:"trx;LogFileName=$($env:LOG_FILE_NAME).trx" release_${{ fromJSON(inputs.matrix).dotnet.tfm }}/MonoMod.UnitTest.dll
          
    - name: Run tests (Mono)
      if: ${{ fromJSON(inputs.matrix).dotnet.isMono }}
      env:
        TFM: ${{ fromJSON(inputs.matrix).dotnet.tfm }}
        RUNNER_TFM: ${{ steps.setup_mono.outputs.runner_tfm }}
        USE_MDH: ${{ steps.setup_mono.outputs.use_mdh }}
        MDH: ${{ steps.setup_mono.outputs.mdh }}
        MONO_DLL: ${{ steps.setup_mono.outputs.mono_dll }}
      run: ./.github/workflows/run-mono-tests.ps1

    # TODO: Non-system Mono

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: test-results ${{ fromJSON(inputs.matrix).title }}
        retention-days: 1
        path: |
          TestResults/*.trx
          TestResults/*.xml
          TestResults/*.log
          TestResults/*.txt
          *.xml
          diaglog.*

    - name: Upload process dumps
      uses: actions/upload-artifact@v6
      if: ${{ always() }}
      with:
        name: test-dumps ${{ fromJSON(inputs.matrix).title }}
        retention-days: 1
        if-no-files-found: ignore
        path: |
          ${{ env.DUMPS_PATH }}*
          **/*.dmp
